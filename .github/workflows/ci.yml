name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Node tests
        run: npm test

      - name: Check version metadata
        run: npm run check-version -- --print

      - name: Validate npm package boundary
        run: npm run pack:check

      - name: Run npm package smoke checks
        run: npm run smoke:npm

      - name: Run POSIX installer tests
        if: runner.os != 'Windows'
        run: npx tsx --test test/installer.test.ts

      - name: Run Windows command, lock, and shell-init tests
        if: runner.os == 'Windows'
        run: npx tsx --test test/cli.test.ts test/locking.test.ts test/shell-init.test.ts

  release:
    name: Publish stable release
    if: >-
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [test]
    runs-on: ubuntu-latest
    concurrency:
      group: wt-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_NAME: "@absolutepraya/wt"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Skip main pushes without a version change
        id: version_change
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git rev-parse HEAD^ 2>/dev/null || true)"
          changed=true
          if [ -n "$previous" ] && git show "$previous:package.json" > "$RUNNER_TEMP/previous-package.json" 2>/dev/null; then
            old_version="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).version)' "$RUNNER_TEMP/previous-package.json")"
            new_version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
            if [ "$old_version" = "$new_version" ]; then changed=false; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Stop when package version did not change
        if: github.event_name == 'push' && steps.version_change.outputs.changed == 'false'
        run: echo "package.json version did not change, skipping release"

      - name: Build release assets
        id: assets
        if: github.event_name != 'push' || steps.version_change.outputs.changed != 'false'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-release.mjs > "$RUNNER_TEMP/release-build.json"
          release_dir="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).directory' "$RUNNER_TEMP/release-build.json")"
          tarball="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).tarball' "$RUNNER_TEMP/release-build.json")"
          version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$RUNNER_TEMP/release-build.json")"
          tag="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).tag' "$RUNNER_TEMP/release-build.json")"
          (cd "$release_dir" && sha256sum -c checksums.txt)
          printf 'dir=%s\ntarball=%s\nversion=%s\ntag=%s\n' "$release_dir" "$tarball" "$version" "$tag" >> "$GITHUB_OUTPUT"

      - name: Validate release version and tag
        if: github.event_name != 'push' || steps.version_change.outputs.changed != 'false'
        env:
          TAG: ${{ steps.assets.outputs.tag }}
        run: npm run check-version -- --tag "$TAG"

      - name: Publish or verify npm package
        id: npm_release
        if: github.event_name != 'push' || steps.version_change.outputs.changed != 'false'
        shell: bash
        env:
          VERSION: ${{ steps.assets.outputs.version }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$VERSION" dist.integrity --json > "$RUNNER_TEMP/npm-integrity.json" 2> "$RUNNER_TEMP/npm-integrity.error"; then
            remote_integrity="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$RUNNER_TEMP/npm-integrity.json")"
            local_integrity="$(node -e 'const crypto=require("node:crypto");const fs=require("node:fs");console.log("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$TARBALL")"
            if [ "$remote_integrity" != "$local_integrity" ]; then
              echo "same-version npm package hash conflict for $PACKAGE_NAME@$VERSION" >&2
              exit 1
            fi
            echo "npm package $PACKAGE_NAME@$VERSION already exists with matching hash"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            if ! grep -Eq 'E404|404 Not Found|No match found' "$RUNNER_TEMP/npm-integrity.error"; then
              cat "$RUNNER_TEMP/npm-integrity.error" >&2
              exit 1
            fi
            npm publish "$TARBALL" --access public
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing GitHub Release assets
        id: github_release
        if: github.event_name != 'push' || steps.version_change.outputs.changed != 'false'
        shell: bash
        env:
          TAG: ${{ steps.assets.outputs.tag }}
          RELEASE_DIR: ${{ steps.assets.outputs.dir }}
        run: |
          set -euo pipefail
          expected="$(find "$RELEASE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)"
          if gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt" 2> "$RUNNER_TEMP/release-view.error"; then
            actual="$(sort "$RUNNER_TEMP/release-assets.txt")"
            if [ "$actual" != "$expected" ]; then
              echo "same-version GitHub Release asset list conflict for $TAG" >&2
              diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
              exit 1
            fi
            existing="$RUNNER_TEMP/existing-release"
            rm -rf "$existing"
            mkdir -m 700 "$existing"
            gh release download "$TAG" --dir "$existing"
            cmp "$RELEASE_DIR/checksums.txt" "$existing/checksums.txt"
            (cd "$existing" && sha256sum -c checksums.txt)
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release $TAG already exists with matching hashes"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag
        if: >-
          (github.event_name != 'push' || steps.version_change.outputs.changed != 'false') &&
          steps.github_release.outputs.exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            target="$(git rev-list -n 1 "$TAG")"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "same-version tag conflict: $TAG points to $target, expected $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release with exact assets
        if: >-
          (github.event_name != 'push' || steps.version_change.outputs.changed != 'false') &&
          steps.github_release.outputs.exists != 'true'
        env:
          TAG: ${{ steps.assets.outputs.tag }}
          RELEASE_DIR: ${{ steps.assets.outputs.dir }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "$RELEASE_DIR/wt" \
            "$RELEASE_DIR/wt.sh" \
            "$RELEASE_DIR/wt.fish" \
            "$RELEASE_DIR/install.sh" \
            "$TARBALL" \
            "$RELEASE_DIR/checksums.txt"
